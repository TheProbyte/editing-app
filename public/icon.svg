<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.45" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff4d12"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="232" r="148"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#141210"/>
  <!-- striped 70s sun -->
  <g clip-path="url(#disc)">
    <rect x="100" y="80" width="312" height="310" fill="url(#sun)"/>
    <rect x="100" y="262" width="312" height="10" fill="#141210"/>
    <rect x="100" y="292" width="312" height="14" fill="#141210"/>
    <rect x="100" y="324" width="312" height="18" fill="#141210"/>
    <rect x="100" y="358" width="312" height="24" fill="#141210"/>
  </g>
  <!-- horizon + aperture ticks -->
  <rect x="76" y="398" width="360" height="10" rx="5" fill="#efe9df"/>
  <rect x="136" y="426" width="240" height="8" rx="4" fill="#efe9df" opacity=".45"/>
</svg>
